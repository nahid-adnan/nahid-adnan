name: Generate contribution snake

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nahid-adnan
          # color_dots takes exactly 5 colours: 0 contributions first,
          # then lowest to highest.
          outputs: |
            dist/snake-dark.svg?color_snake=#FFD43B&color_dots=#0b2030,#0e3a52,#155e8a,#2f80b8,#4B8BBE
            dist/snake-light.svg?color_snake=#306998&color_dots=#ebedf0,#fff3c4,#ffe873,#FFD43B,#e0aa00
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
