name: Build animated streak card

# Builds the card from GitHub's own GraphQL API and draws the SVG locally,
# so there is no third-party card service that can rate-limit or 503.

on:
  schedule:
    - cron: "0 18 * * *"   # 04:00 Brisbane
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the card
        env:
          # GITHUB_TOKEN covers public contributions. To include private ones,
          # create a PAT with read:user, save it as STREAK_TOKEN, and it wins.
          GH_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
          STREAK_USER: nahid-adnan
          STREAK_OUT: assets/streak.svg
        run: python3 scripts/streak_card.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "Update streak card" || exit 0
          git push
