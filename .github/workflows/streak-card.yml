name: Build animated streak card

# streak-stats has no animation option, so we fetch the card and wrap it in
# our own SVG with a cycling border that matches animation=rgb-soft on the
# github-profile-summary-cards above it. Only needs the built-in token.

on:
  schedule:
    - cron: "0 18 * * *"   # 04:00 Brisbane
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and wrap the streak card
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import re, sys, urllib.request

          URL = ("https://streak-stats.demolab.com/?user=nahid-adnan"
                 "&background=0D1117&hide_border=true"
                 "&stroke=30363D&ring=58A6FF&fire=FFD43B"
                 "&currStreakNum=C9D1D9&sideNums=C9D1D9"
                 "&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E")

          req = urllib.request.Request(URL, headers={"User-Agent": "readme-bot"})
          raw = urllib.request.urlopen(req, timeout=45).read().decode("utf-8", "replace")

          # never overwrite a good card with an error card
          if "<svg" not in raw or "rate limited" in raw.lower():
              print("Upstream unavailable, keeping the existing card.")
              sys.exit(0)

          m     = re.search(r"<svg\b[^>]*>", raw, re.S)
          head  = m.group(0)
          inner = re.sub(r"</svg>\s*$", "", raw[m.end():].strip(), flags=re.S)

          vb = re.search(r'viewBox\s*=\s*"([^"]+)"', head)
          if vb:
              x, y, w, h = [float(v) for v in vb.group(1).replace(",", " ").split()]
          else:
              w = float(re.search(r'width\s*=\s*"(\d+(?:\.\d+)?)', head).group(1))
              h = float(re.search(r'height\s*=\s*"(\d+(?:\.\d+)?)', head).group(1))
              x = y = 0.0

          out = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="{w:g}" height="{h:g}" viewBox="{x:g} {y:g} {w:g} {h:g}" role="img" aria-label="Contribution streak">
          <style>
            .nxFrame {{ fill:none; stroke-width:2; animation: nxHue 9s linear infinite; }}
            @keyframes nxHue {{
              0%   {{ stroke:#58A6FF; }}
              20%  {{ stroke:#A371F7; }}
              40%  {{ stroke:#F778BA; }}
              60%  {{ stroke:#FFD43B; }}
              80%  {{ stroke:#3FB950; }}
              100% {{ stroke:#58A6FF; }}
            }}
          </style>
          {inner}
          <rect class="nxFrame" x="{x+1.5:g}" y="{y+1.5:g}" width="{w-3:g}" height="{h-3:g}" rx="7"/>
          </svg>
          '''
          open("assets/streak.svg", "w").write(out)
          print(f"Wrote assets/streak.svg ({w:g}x{h:g})")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "Update animated streak card" || exit 0
          git push
