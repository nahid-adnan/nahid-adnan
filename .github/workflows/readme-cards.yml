name: Update README cards

# Generates the stats cards as static SVGs inside this repo instead of
# hot-linking the public github-readme-stats endpoint, which is rate
# limited and has been paused in the past. Static SVGs cannot 404.

on:
  schedule:
    - cron: "0 19 * * *"   # 05:00 Brisbane time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # include_all_commits counts every year, not just this one.
          # count_private needs STATS_TOKEN (a PAT) to work.
          options: username=nahid-adnan&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&title_color=FFD43B&icon_color=4B8BBE&text_color=C9E2EF&bg_color=0B2030&custom_title=Nahid's%20GitHub%20activity
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=nahid-adnan&layout=compact&langs_count=8&hide_border=true&title_color=FFD43B&text_color=C9E2EF&bg_color=0B2030&custom_title=Languages%20by%20code%20volume
          path: assets/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Optional repo cards for the Selected work section.
      # CHECK the repo names before enabling.
      # - name: Generate NAPLAN pin
      #   uses: readme-tools/github-readme-stats-action@v1
      #   with:
      #     card: pin
      #     options: username=nahid-adnan&repo=naplan-qld-equity-dashboard&hide_border=true&title_color=FFD43B&text_color=C9E2EF&bg_color=0B2030
      #     path: assets/pin-naplan.svg
      #     token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update README cards" || exit 0
          git push
