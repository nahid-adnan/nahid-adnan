  .gap { opacity:0; animation:fade .6s ease-out 1.4s forwards; }
  .lst { opacity:0; animation:flick 3.2s ease-in-out infinite; }
  @keyframes flick { 0%,8% {opacity:.18} 20%,70% {opacity:1} 92%,100% {opacity:.18} }
  .tok { opacity:0; animation:tok 4s ease-out infinite; }
  @keyframes tok { 0%,5% {opacity:0} 18%,88% {opacity:.95} 100% {opacity:0} }
  .ln { opacity:0; animation:tok 3.6s ease-out infinite; }
  .caret { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
  .box { animation:lit 3.3s ease-in-out infinite; }
  @keyframes lit { 0%,18% {opacity:.35} 25%,38% {opacity:1} 50%,100% {opacity:.35} }
</style>
