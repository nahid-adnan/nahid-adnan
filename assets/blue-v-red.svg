  <text class="ttl fade" x="150.0" y="152" text-anchor="middle" style="animation-delay:.3s">blue-v-red</text><text class="desc fade" x="150.0" y="175" text-anchor="middle" style="animation-delay:0.45s">A CLI game that logs every round,</text><text class="desc fade" x="150.0" y="190" text-anchor="middle" style="animation-delay:0.53s">then analyses its own log.</text><g class="ch"><rect x="96.6" y="211" width="50.4" height="18" rx="4" fill="#5B8DEF"/><text class="chip" x="121.8" y="223.5" text-anchor="middle" fill="#fff">Python</text></g><g class="ch"><rect x="153" y="211" width="50.4" height="18" rx="4" fill="#150458"/><text class="chip" x="178.2" y="223.5" text-anchor="middle" fill="#fff">pandas</text></g>
