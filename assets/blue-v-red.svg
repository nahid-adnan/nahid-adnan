<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 268" width="300" height="268" role="img" aria-label="blue-v-red" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
