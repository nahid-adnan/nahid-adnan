<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Contribution streak">
<style>
  text { font-family:'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .num  { font-size:38px; font-weight:700; fill:#58A6FF; }
  .lab  { font-size:13.5px; font-weight:600; fill:#C9D1D9; }
  .dt   { font-size:11.5px; fill:#8B949E; }
  .curLab { font-size:13.5px; font-weight:700; fill:#58A6FF; }
  .fade { opacity:0; animation:fade .7s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  .ring { fill:none; stroke:#58A6FF; stroke-width:5;
           stroke-dasharray:264; stroke-dashoffset:264;
           animation:draw 1.1s cubic-bezier(.4,0,.2,1) .3s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .flame { animation:flick 1.9s ease-in-out infinite; transform-origin:center; }
  @keyframes flick { 0%,100% { opacity:.85; } 50% { opacity:1; } }
  .frame { fill:none; stroke-width:2; animation:hue 9s linear infinite; }
  @keyframes hue { 0% {stroke:#58A6FF} 20% {stroke:#A371F7} 40% {stroke:#F778BA}
                    60% {stroke:#FFD43B} 80% {stroke:#3FB950} 100% {stroke:#58A6FF} }
</style>
  <rect width="495" height="195" rx="7" fill="#0D1117"/>

  <line x1="165" y1="34" x2="165" y2="161" stroke="#30363D" stroke-width="1"/>
  <line x1="330" y1="34" x2="330" y2="161" stroke="#30363D" stroke-width="1"/>

  <g class="fade" style="animation-delay:.10s">
    <text class="num" x="82.5" y="86"  text-anchor="middle">136</text>
    <text class="lab" x="82.5" y="116" text-anchor="middle">Total Contributions</text>
    <text class="dt"  x="82.5" y="140" text-anchor="middle">Apr 5 - Present</text>
  </g>

  <g class="fade" style="animation-delay:.25s">
    <circle class="ring" cx="247.5" cy="82" r="42"/>
    <text class="num" x="247.5" y="95" text-anchor="middle">2</text>
    <text class="curLab" x="247.5" y="140" text-anchor="middle">Current Streak</text>
    <text class="dt" x="247.5" y="162" text-anchor="middle">Sep 10</text>
    <g class="flame">
      <path d="M247.5 28 c 5 7 -3 9 0 15 c 4 -2 5 -7 4 -10 c 5 4 7 10 4 15 c -2 4 -6 6 -8 6 c -6 0 -11 -4 -11 -10 c 0 -8 8 -11 11 -16 z" fill="#58A6FF"/>
    </g>
  </g>

  <g class="fade" style="animation-delay:.40s">
    <text class="num" x="412.5" y="86"  text-anchor="middle">3</text>
    <text class="lab" x="412.5" y="116" text-anchor="middle">Longest Streak</text>
    <text class="dt"  x="412.5" y="140" text-anchor="middle">Sep 5 - Sep 7</text>
  </g>

  <rect class="frame" x="1.5" y="1.5" width="492" height="192" rx="7"/>
</svg>
