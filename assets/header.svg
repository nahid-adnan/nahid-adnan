<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="B M Nahid Hasan Adnan, data analyst, statistics first" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2030"/>
      <stop offset="0.55" stop-color="#0F2E3F"/>
      <stop offset="1" stop-color="#143C50"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .t { font-family: "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 37px; font-weight: 700; fill: #EDF4F8; }
    .role { font-size: 19px; font-weight: 400; fill: #9FC2D4; }
    .meta { font-size: 14px; fill: #6FA5C0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .axis { stroke: #2F6280; stroke-width: 1.5; }
    .grid { stroke: #1C4257; stroke-width: 1; }

    .fade  { opacity: 0; animation: fade .75s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }

    .pt  { opacity: 0; fill: #4B8BBE; animation: pop .4s ease-out forwards; }
    @keyframes pop { to { opacity: .95; } }

    .res { opacity: 0; stroke: #7FB2D6; stroke-width: 1.2;
           animation: res .7s ease-out forwards; animation-delay: 2.55s; }
    @keyframes res { to { opacity: .32; } }

    .fit { fill: none; stroke: #FFD43B; stroke-width: 3; stroke-linecap: round;
           stroke-dasharray: 340; stroke-dashoffset: 340;
           animation: draw 1.15s cubic-bezier(.4,0,.2,1) forwards; animation-delay: 1.5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .cap { opacity: 0; animation: fade .7s ease-out forwards; animation-delay: 3.1s; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- ============ left: identity ============ -->
    <text class="t name fade" x="62" y="112">B M Nahid Hasan Adnan</text>

    <rect x="62" y="130" height="4" width="0" rx="2" fill="#FFD43B">
      <animate attributeName="width" from="0" to="92" dur="0.75s" begin="0.45s"
               calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1" fill="freeze"/>
    </rect>

    <text class="t role fade" x="62" y="180" style="animation-delay:.25s">Data analyst. Statistics first, dashboards second.</text>
    <text class="t meta fade" x="62" y="216" style="animation-delay:.45s">MSc Statistics  &#8594;  Master of Data Science, JCU</text>
    <text class="t meta fade" x="62" y="240" style="animation-delay:.6s">Cairns, QLD  &#183;  open to data analyst roles</text>

    <!-- ============ right: a fit being made ============ -->
    <g>
      <line class="grid fade" x1="648" y1="110" x2="956" y2="110" style="animation-delay:.10s"/>
      <line class="grid fade" x1="648" y1="160" x2="956" y2="160" style="animation-delay:.15s"/>
      <line class="grid fade" x1="648" y1="210" x2="956" y2="210" style="animation-delay:.20s"/>
      <line class="grid fade" x1="725" y1="60"  x2="725" y2="255" style="animation-delay:.25s"/>
      <line class="grid fade" x1="800" y1="60"  x2="800" y2="255" style="animation-delay:.30s"/>
      <line class="grid fade" x1="878" y1="60"  x2="878" y2="255" style="animation-delay:.35s"/>

      <line class="axis fade" x1="648" y1="58" x2="648" y2="256"/>
      <line class="axis fade" x1="648" y1="256" x2="956" y2="256"/>

      <!-- residuals: point to fitted line -->
      <g>
        <line class="res" x1="652" y1="245" x2="652" y2="236.2"/>
        <line class="res" x1="672" y1="215" x2="672" y2="226.9"/>
        <line class="res" x1="692" y1="229" x2="692" y2="217.7"/>
        <line class="res" x1="712" y1="203" x2="712" y2="208.5"/>
        <line class="res" x1="732" y1="212" x2="732" y2="199.3"/>
        <line class="res" x1="752" y1="181" x2="752" y2="190.1"/>
        <line class="res" x1="772" y1="186" x2="772" y2="180.9"/>
        <line class="res" x1="792" y1="161" x2="792" y2="171.7"/>
        <line class="res" x1="812" y1="172" x2="812" y2="162.5"/>
        <line class="res" x1="832" y1="148" x2="832" y2="153.3"/>
        <line class="res" x1="852" y1="156" x2="852" y2="144.1"/>
        <line class="res" x1="872" y1="127" x2="872" y2="134.8"/>
        <line class="res" x1="892" y1="133" x2="892" y2="125.6"/>
        <line class="res" x1="912" y1="103" x2="912" y2="116.4"/>
        <line class="res" x1="932" y1="115" x2="932" y2="107.2"/>
        <line class="res" x1="952" y1="94" x2="952" y2="98"/>
      </g>

      <!-- the fitted line -->
      <path class="fit" d="M 648 238 L 952 98"/>

      <!-- observations -->
      <circle class="pt" cx="652" cy="245" r="4.5" style="animation-delay:0.50s"/>
      <circle class="pt" cx="672" cy="215" r="4.5" style="animation-delay:0.56s"/>
      <circle class="pt" cx="692" cy="229" r="4.5" style="animation-delay:0.62s"/>
      <circle class="pt" cx="712" cy="203" r="4.5" style="animation-delay:0.68s"/>
      <circle class="pt" cx="732" cy="212" r="4.5" style="animation-delay:0.74s"/>
      <circle class="pt" cx="752" cy="181" r="4.5" style="animation-delay:0.80s"/>
      <circle class="pt" cx="772" cy="186" r="4.5" style="animation-delay:0.86s"/>
      <circle class="pt" cx="792" cy="161" r="4.5" style="animation-delay:0.92s"/>
      <circle class="pt" cx="812" cy="172" r="4.5" style="animation-delay:0.98s"/>
      <circle class="pt" cx="832" cy="148" r="4.5" style="animation-delay:1.04s"/>
      <circle class="pt" cx="852" cy="156" r="4.5" style="animation-delay:1.10s"/>
      <circle class="pt" cx="872" cy="127" r="4.5" style="animation-delay:1.16s"/>
      <circle class="pt" cx="892" cy="133" r="4.5" style="animation-delay:1.22s"/>
      <circle class="pt" cx="912" cy="103" r="4.5" style="animation-delay:1.28s"/>
      <circle class="pt" cx="932" cy="115" r="4.5" style="animation-delay:1.34s"/>
      <circle class="pt" cx="952" cy="94" r="4.5" style="animation-delay:1.40s"/>

      <text class="t meta cap" x="648" y="284" style="font-size:12.5px;fill:#5C93AE">the line is the summary; the gaps are the story</text>
    </g>
  </g>
</svg>
