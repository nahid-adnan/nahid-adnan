<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="SAS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4FA0"/>
      <stop offset="0.55" stop-color="#1272C8"/>
      <stop offset="1" stop-color="#1E9BE5"/>
    </linearGradient>
    <linearGradient id="sasSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sasClip"><rect width="256" height="256" rx="60"/></clipPath>
  </defs>
  <style>
    .sasCurve { fill:none; stroke:#FFFFFF; stroke-width:9; stroke-linecap:round; opacity:.30;
                stroke-dasharray:300; stroke-dashoffset:300;
                animation: sasDraw 1.6s cubic-bezier(.4,0,.2,1) forwards; animation-delay:.3s; }
    @keyframes sasDraw { to { stroke-dashoffset:0; } }
    .sasDot { fill:#FFD43B; opacity:0; animation: sasPop .5s ease-out forwards; }
    @keyframes sasPop { to { opacity:.9; } }
    .sasWord { font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif;
               font-size:78px; font-weight:700; letter-spacing:1px; fill:#FFFFFF; }
  </style>
  <g clip-path="url(#sasClip)">
    <rect width="256" height="256" fill="url(#sasBg)"/>
    <rect width="256" height="130" fill="url(#sasSheen)"/>
    <path class="sasCurve" d="M22 196 C 70 196, 78 128, 116 128 S 168 74, 234 62"/>
    <circle class="sasDot" cx="116" cy="128" r="9" style="animation-delay:1.5s"/>
    <circle class="sasDot" cx="234" cy="62"  r="9" style="animation-delay:1.7s"/>
    <text class="sasWord" x="128" y="150" text-anchor="middle">SAS</text>
    <rect x="86" y="172" width="84" height="9" rx="4.5" fill="#FFD43B" opacity=".95"/>
  </g>
</svg>
