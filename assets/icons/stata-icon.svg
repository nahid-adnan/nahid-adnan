<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Stata" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="staBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12395C"/>
      <stop offset="0.55" stop-color="#1D5F94"/>
      <stop offset="1" stop-color="#2E86C1"/>
    </linearGradient>
    <linearGradient id="staSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="staClip"><rect width="256" height="256" rx="60"/></clipPath>
  </defs>
  <style>
    .staBar { fill:#FFFFFF; opacity:0; animation: staRise .55s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes staRise { to { opacity:.28; } }
    .staWord { font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif;
               font-size:62px; font-weight:700; letter-spacing:0.5px; fill:#FFFFFF; }
  </style>
  <g clip-path="url(#staClip)">
    <rect width="256" height="256" fill="url(#staBg)"/>
    <rect width="256" height="130" fill="url(#staSheen)"/>
    <g>
      <rect class="staBar" x="30"  y="150" width="26" height="76"  rx="6" style="animation-delay:.30s"/>
      <rect class="staBar" x="72"  y="118" width="26" height="108" rx="6" style="animation-delay:.42s"/>
      <rect class="staBar" x="114" y="134" width="26" height="92"  rx="6" style="animation-delay:.54s"/>
      <rect class="staBar" x="156" y="92"  width="26" height="134" rx="6" style="animation-delay:.66s"/>
      <rect class="staBar" x="198" y="66"  width="26" height="160" rx="6" style="animation-delay:.78s"/>
    </g>
    <text class="staWord" x="128" y="140" text-anchor="middle">Stata</text>
    <rect x="82" y="164" width="92" height="9" rx="4.5" fill="#7FD4FF" opacity=".95"/>
  </g>
</svg>
