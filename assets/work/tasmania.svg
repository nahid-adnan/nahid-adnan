  <text class="ttl fade" x="150.0" y="145" text-anchor="middle" style="animation-delay:.3s">Tasmania</text><text class="ttl fade" x="150.0" y="164" text-anchor="middle" style="animation-delay:.3s">short-stay dashboard</text><text class="desc fade" x="150.0" y="187" text-anchor="middle" style="animation-delay:0.45s">5,293 listings, $145.3M pool.</text><text class="desc fade" x="150.0" y="202" text-anchor="middle" style="animation-delay:0.53s">What-if repricing, 5 linked pages.</text><g class="ch"><rect x="99.8" y="223" width="63.2" height="18" rx="4" fill="#2B6CB0"/><text class="chip" x="131.4" y="235.5" text-anchor="middle" fill="#fff">Power BI</text></g><g class="ch"><rect x="169" y="223" width="31.2" height="18" rx="4" fill="#1A4971"/><text class="chip" x="184.6" y="235.5" text-anchor="middle" fill="#fff">DAX</text></g>
