<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" width="900" height="118" role="img" aria-label="cp1401-assignment-1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text { font-family:'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .ttl  { font-size:18.5px; font-weight:700; fill:#4B8BBE; }
  .desc { font-size:13.5px; fill:#9FC2D4; }
  .chip { font-size:11px; font-weight:700; }
  .fade { opacity:0; animation:fade .55s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  .body { opacity:0; animation:slide .6s cubic-bezier(.2,.7,.3,1) .12s forwards; }
  @keyframes slide { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:translateX(0); } }
  .spine { stroke-dasharray:120; stroke-dashoffset:120; animation:draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .ring { animation:pulse 2.6s ease-out infinite; transform-origin:46px 54px; }
  @keyframes pulse { 0% { r:8; opacity:.7; } 100% { r:19; opacity:0; } }
  .arrow { animation:nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(5px); } }
  .ch { opacity:0; animation:fade .5s ease-out .72s forwards; }
  .ic { opacity:0; animation:fade .5s ease-out .3s forwards; }
</style>
  <line class="spine" x1="46" y1="0" x2="46" y2="54" stroke="#27506B" stroke-width="3"/>
  <circle class="ring" cx="46" cy="54" r="8" fill="none" stroke="#4B8BBE" stroke-width="2"/>
  <circle cx="46" cy="54" r="7.5" fill="#0B1B26" stroke="#4B8BBE" stroke-width="3"/>
  <line class="fade" x1="55" y1="54" x2="84" y2="54" stroke="#27506B" stroke-width="2.5" style="animation-delay:.25s"/>
  <g class="body">
    <rect x="84" y="8" width="796" height="100" rx="11" fill="#0E2433" stroke="#1D3B4E" stroke-width="1.5"/>
    <g class="ic"><path d="M111 28 L106 33 L111 38" stroke="#4B8BBE" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 26 L115 40" stroke="#4B8BBE" stroke-width="2.4" stroke-linecap="round"/><path d="M123 28 L128 33 L123 38" stroke="#4B8BBE" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="ttl fade" x="134" y="40" style="animation-delay:.32s">cp1401-assignment-1</text>
    <text class="desc fade" x="106" y="62" style="animation-delay:0.45s">Three Input-Process-Output programs covering conditionals, loops and input validation.</text><text class="desc fade" x="106" y="81" style="animation-delay:0.53s">The starting point — kept here because progress is easier to see with one.</text>
    <g class="ch"><rect x="106" y="88" width="105.9" height="21" rx="5" fill="#4B8BBE"/><text class="chip" x="158.95" y="102.5" text-anchor="middle" fill="#fff">Pure Python 3</text></g>
    <g class="arrow">
      <path d="M846 34 L856 40 L846 46" stroke="#4B8BBE" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    </g>
  </g>
</svg>
