<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 268" width="300" height="268" role="img" aria-label="NAPLAN QLD equity dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bnaplan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08192A"/><stop offset="1" stop-color="#11293F"/>
  </linearGradient>
  <clipPath id="cnaplan"><path d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .ttl { font-size:14.5px; font-weight:700; fill:#58A6FF; }
  .desc { font-size:11px; fill:#A7C4D6; }
  .chip { font-size:9.5px; font-weight:700; }
  .vlab { font-size:9px; font-weight:700; }
  .fade { opacity:0; animation:fade .55s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  .tile { opacity:0; animation:rise .65s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  .edge { fill:none; stroke:#58A6FF; stroke-width:2.5; stroke-linecap:round;
           stroke-dasharray:90 768; animation:trace 4.5s linear infinite; }
  @keyframes trace { from { stroke-dashoffset:858; } to { stroke-dashoffset:0; } }
  .ch { opacity:0; animation:fade .5s ease-out .75s forwards; }
  .cellf { opacity:0; animation:fade .5s ease-out forwards; }
  .sup { opacity:0; animation:supIn 3.4s ease-in-out infinite; }
  @keyframes supIn { 0%,10% {opacity:0} 25%,75% {opacity:.95} 95%,100% {opacity:0} }
  .gap { opacity:0; animation:fade .6s ease-out 1.4s forwards; }
  .lst { opacity:0; animation:flick 3.2s ease-in-out infinite; }
  @keyframes flick { 0%,8% {opacity:.18} 20%,70% {opacity:1} 92%,100% {opacity:.18} }
  .tok { opacity:0; animation:tok 4s ease-out infinite; }
  @keyframes tok { 0%,5% {opacity:0} 18%,88% {opacity:.95} 100% {opacity:0} }
  .ln { opacity:0; animation:tok 3.6s ease-out infinite; }
  .caret { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
  .box { animation:lit 3.3s ease-in-out infinite; }
  @keyframes lit { 0%,18% {opacity:.35} 25%,38% {opacity:1} 50%,100% {opacity:.35} }
</style>
<g class="tile">
  <path d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z" fill="url(#bnaplan)" stroke="#58A6FF" stroke-opacity=".3" stroke-width="1.6"/>
  <g clip-path="url(#cnaplan)"><g transform="translate(72.0,58)"><rect x="0" y="0" width="0" height="9" rx="3" fill="#58A6FF" opacity="1"><animate attributeName="width" values="0;132;132" dur="4s" keyTimes="0;.35;1" repeatCount="indefinite"/></rect><rect x="0" y="15" width="0" height="9" rx="3" fill="#58A6FF" opacity="0.45"><animate attributeName="width" values="0;78;78" dur="4s" keyTimes="0;.35;1" repeatCount="indefinite"/></rect><g class="gap"><path d="M80 36 L130 36" stroke="#58A6FF" stroke-width="1.5"/><path d="M84 33 L79 36 L84 39 M126 33 L131 36 L126 39" stroke="#58A6FF" stroke-width="1.5" fill="none"/><text class="vlab" x="105" y="31" text-anchor="middle" fill="#58A6FF">gap</text></g><rect class="cellf" x="0" y="48" width="13" height="13" rx="3" fill="#58A6FF" style="animation-delay:0.00s"/><rect class="cellf" x="17" y="48" width="13" height="13" rx="3" fill="#58A6FF" style="animation-delay:0.12s"/><g class="sup" style="animation-delay:0.24s"><rect x="34" y="48" width="13" height="13" rx="3" fill="none" stroke="#58A6FF" stroke-width="1.3" stroke-dasharray="3 2"/><line x1="37" y1="54.5" x2="44" y2="54.5" stroke="#58A6FF" stroke-width="1.5"/></g><rect class="cellf" x="51" y="48" width="13" height="13" rx="3" fill="#58A6FF" style="animation-delay:0.36s"/><rect class="cellf" x="68" y="48" width="13" height="13" rx="3" fill="#58A6FF" style="animation-delay:0.48s"/><g class="sup" style="animation-delay:0.60s"><rect x="85" y="48" width="13" height="13" rx="3" fill="none" stroke="#58A6FF" stroke-width="1.3" stroke-dasharray="3 2"/><line x1="88" y1="54.5" x2="95" y2="54.5" stroke="#58A6FF" stroke-width="1.5"/></g><rect class="cellf" x="102" y="48" width="13" height="13" rx="3" fill="#58A6FF" style="animation-delay:0.72s"/></g></g>
  <text class="ttl fade" x="150.0" y="145" text-anchor="middle" style="animation-delay:.3s">NAPLAN QLD</text><text class="ttl fade" x="150.0" y="164" text-anchor="middle" style="animation-delay:.3s">equity dashboard</text><text class="desc fade" x="150.0" y="187" text-anchor="middle" style="animation-delay:0.45s">1,369 schools, 60,236-row fact table.</text><text class="desc fade" x="150.0" y="202" text-anchor="middle" style="animation-delay:0.53s">Suppressed stays suppressed, never zero.</text><g class="ch"><rect x="99.8" y="223" width="63.2" height="18" rx="4" fill="#2B6CB0"/><text class="chip" x="131.4" y="235.5" text-anchor="middle" fill="#fff">Power BI</text></g><g class="ch"><rect x="169" y="223" width="31.2" height="18" rx="4" fill="#1A4971"/><text class="chip" x="184.6" y="235.5" text-anchor="middle" fill="#fff">DAX</text></g>
  <path class="edge" d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z"/>
</g>
</svg>
