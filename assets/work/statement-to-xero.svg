<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 268" width="300" height="268" role="img" aria-label="statement-to-xero: PDF bank statements to a checked, Xero-ready CSV">
<defs>
  <linearGradient id="bstx" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08192A"/><stop offset="1" stop-color="#11293F"/>
  </linearGradient>
  <clipPath id="cstx"><path d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .ttl { font-size:14.5px; font-weight:700; fill:#58A6FF; }
  .desc { font-size:11px; fill:#A7C4D6; }
  .chip { font-size:9.5px; font-weight:700; }
  .vlab { font-size:9px; font-weight:700; }
  .fade { opacity:0; animation:fade .55s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  .tile { opacity:0; animation:rise .65s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  .edge { fill:none; stroke:#58A6FF; stroke-width:2.5; stroke-linecap:round;
           stroke-dasharray:90 768; animation:trace 4.5s linear infinite; }
  @keyframes trace { from { stroke-dashoffset:858; } to { stroke-dashoffset:0; } }
  .ch { opacity:0; animation:fade .5s ease-out .75s forwards; }
  .flow { stroke-dasharray:4 4; animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-8; } }
  .row { opacity:0; animation:row 4s ease-out infinite; }
  @keyframes row { 0% {opacity:0} 12%,85% {opacity:1} 100% {opacity:0} }
  .tick { stroke-dasharray:14; stroke-dashoffset:14; animation:tick 4s ease-out infinite; }
  @keyframes tick { 0%,15% {stroke-dashoffset:14} 30%,85% {stroke-dashoffset:0} 100% {stroke-dashoffset:14} }
  .ok { opacity:0; animation:row 4s ease-out 1.1s infinite; }
</style>
<g class="tile">
  <path d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z" fill="url(#bstx)" stroke="#58A6FF" stroke-opacity=".3" stroke-width="1.6"/>
  <g clip-path="url(#cstx)"><g transform="translate(70,50)">
    <!-- PDF statement -->
    <rect x="0" y="4" width="40" height="56" rx="3" fill="#0D2236" stroke="#58A6FF" stroke-opacity=".7" stroke-width="1.2"/>
    <path d="M30 4 L40 14 L30 14 Z" fill="#58A6FF" opacity=".5"/>
    <text class="vlab" x="20" y="74" text-anchor="middle" fill="#58A6FF" opacity=".75">PDF</text>
    <rect x="6" y="20" width="28" height="3" rx="1.5" fill="#A7C4D6" opacity=".55"/>
    <rect x="6" y="28" width="22" height="3" rx="1.5" fill="#A7C4D6" opacity=".55"/>
    <rect x="6" y="36" width="26" height="3" rx="1.5" fill="#A7C4D6" opacity=".55"/>
    <rect x="6" y="44" width="18" height="3" rx="1.5" fill="#A7C4D6" opacity=".55"/>
    <!-- Claude extracts -->
    <line class="flow" x1="46" y1="32" x2="74" y2="32" stroke="#D97757" stroke-width="2"/>
    <path d="M72 28 L78 32 L72 36" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
    <text class="vlab" x="62" y="24" text-anchor="middle" fill="#D97757">AI</text>
    <!-- checked rows -->
    <g transform="translate(84,6)">
      <g class="row" style="animation-delay:0s"><rect x="0" y="0" width="48" height="10" rx="2" fill="#13304A"/><path class="tick" d="M52 5 L55 8 L60 2" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" style="animation-delay:0s"/></g>
      <g class="row" style="animation-delay:.25s"><rect x="0" y="14" width="48" height="10" rx="2" fill="#13304A"/><path class="tick" d="M52 19 L55 22 L60 16" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" style="animation-delay:.25s"/></g>
      <g class="row" style="animation-delay:.5s"><rect x="0" y="28" width="48" height="10" rx="2" fill="#13304A"/><path class="tick" d="M52 33 L55 36 L60 30" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" style="animation-delay:.5s"/></g>
      <g class="row" style="animation-delay:.75s"><rect x="0" y="42" width="48" height="10" rx="2" fill="#13304A"/><path class="tick" d="M52 47 L55 50 L60 44" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" style="animation-delay:.75s"/></g>
      <text class="vlab ok" x="30" y="68" text-anchor="middle" fill="#FFD43B">diff 0.00</text>
    </g>
  </g></g>
  <text class="ttl fade" x="150.0" y="145" text-anchor="middle" style="animation-delay:.3s">statement-to-xero</text><text class="ttl fade" x="150.0" y="164" text-anchor="middle" style="animation-delay:.3s">PDF to Xero, checked</text><text class="desc fade" x="150.0" y="187" text-anchor="middle" style="animation-delay:0.45s">Claude extracts, arithmetic verifies.</text><text class="desc fade" x="150.0" y="202" text-anchor="middle" style="animation-delay:0.53s">No Xero file until it ties to the cent.</text><g class="ch"><rect x="76.0" y="223" width="44.0" height="18" rx="4" fill="#3776AB"/><text class="chip" x="98.0" y="235.5" text-anchor="middle" fill="#fff">Python</text></g><g class="ch"><rect x="126.0" y="223" width="58.0" height="18" rx="4" fill="#D97757"/><text class="chip" x="155.0" y="235.5" text-anchor="middle" fill="#fff">Claude API</text></g><g class="ch"><rect x="190.0" y="223" width="34.0" height="18" rx="4" fill="#13B5EA"/><text class="chip" x="207.0" y="235.5" text-anchor="middle" fill="#fff">Xero</text></g>
  <path class="edge" d="M 7 134 L 78.5 10 L 221.5 10 L 293 134 L 221.5 258 L 78.5 258 Z"/>
</g>
</svg>
