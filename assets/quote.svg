<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="I'd rather understand why a number moved than produce a chart faster" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B2030"/><stop offset="1" stop-color="#123A52"/>
  </linearGradient>
  <clipPath id="wipe1"><rect x="378" y="40" width="0" height="34">
    <animate attributeName="width" from="0" to="480" dur="1.5s" begin="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="wipe2"><rect x="378" y="78" width="0" height="34">
    <animate attributeName="width" from="0" to="350" dur="1.1s" begin="2.0s" fill="freeze"/></rect></clipPath>
  <clipPath id="card"><rect width="900" height="160" rx="10"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .eyebrow { font-size:11.5px; font-weight:600; fill:#6FA5C0; letter-spacing:1.6px; }
  .metric  { font-size:38px; font-weight:700; fill:#EDF4F8; }
  .quote   { font-size:21px; font-style:italic; fill:#EDF4F8; }
  .chiptxt { font-size:12.5px; font-weight:700; }
  .why     { font-size:12.5px; font-weight:700; fill:#FFD43B; font-style:italic; }

  /* four readings, each holding for a quarter of the loop */
  .v { opacity:0; animation: show 8s linear infinite; }
  @keyframes show { 0%,1% {opacity:1} 24%,100% {opacity:0} }
  .v2 { animation-delay:2s } .v3 { animation-delay:4s } .v4 { animation-delay:6s }

  .up   { opacity:0; animation: chip 8s linear infinite; }
  .down { opacity:0; animation: chip 8s linear infinite 4s; }
  @keyframes chip { 0%,1% {opacity:1} 49%,100% {opacity:0} }

  .ask { opacity:0; animation: ask 8s ease-in-out infinite; }
  @keyframes ask { 0%,60% {opacity:0} 70%,92% {opacity:1} 100% {opacity:0} }

  .rule { stroke-dasharray:300; stroke-dashoffset:300;
          animation: draw 1s ease-out 3.1s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
</style>

<g clip-path="url(#card)">
  <rect width="900" height="160" fill="url(#qbg)"/>

  <!-- a number, moving -->
  <text class="eyebrow" x="42" y="38">SCHOOLS REPORTING</text>
  <g>
    <text class="metric v"    x="42" y="84">1,204</text>
    <text class="metric v v2" x="42" y="84">1,246</text>
    <text class="metric v v3" x="42" y="84">1,193</text>
    <text class="metric v v4" x="42" y="84">1,318</text>
  </g>

  <g class="up">
    <rect x="164" y="58" width="70" height="24" rx="12" fill="#12341F"/>
    <path d="M176 74 L181 64 L186 74 Z" fill="#3FB950"/>
    <text class="chiptxt" x="192" y="75" fill="#3FB950">3.4%</text>
  </g>
  <g class="down">
    <rect x="164" y="58" width="70" height="24" rx="12" fill="#3A1518"/>
    <path d="M176 64 L186 64 L181 74 Z" fill="#F85149"/>
    <text class="chiptxt" x="192" y="75" fill="#F85149">4.2%</text>
  </g>

  <!-- the shape behind it -->
  <path fill="none" stroke="#4B8BBE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        d="M42 132 L84 124 L126 128 L168 112 L210 118 L252 104 L294 96">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M42 132 L84 124 L126 128 L168 112 L210 118 L252 104 L294 96;
              M42 130 L84 118 L126 122 L168 106 L210 110 L252 100 L294 88;
              M42 128 L84 122 L126 116 L168 120 L210 112 L252 116 L294 122;
              M42 134 L84 126 L126 120 L168 110 L210 102 L252 94 L294 82;
              M42 132 L84 124 L126 128 L168 112 L210 118 L252 104 L294 96"/>
  </path>
  <circle r="4.5" cx="294" fill="#FFD43B">
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="96;88;122;82;96"/>
  </circle>
  <g class="ask">
    <line x1="294" y1="60" x2="294" y2="88" stroke="#FFD43B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="why" x="302" y="56">why?</text>
  </g>

  <line x1="348" y1="34" x2="348" y2="126" stroke="#24455C" stroke-width="1.5"/>

  <!-- the line, typed out -->
  <g clip-path="url(#wipe1)">
    <text class="quote" x="378" y="66">I'd rather understand why a number moved</text>
  </g>
  <g clip-path="url(#wipe2)">
    <text class="quote" x="378" y="104">than produce a chart faster.</text>
  </g>
  <line class="rule" x1="378" y1="124" x2="678" y2="124" stroke="#FFD43B" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
